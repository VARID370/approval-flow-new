<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to ApprovalFlow to manage your document approval workflows.">
  <title>Login — ApprovalFlow</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">AF</div>
          <h2>Welcome Back</h2>
          <p>Sign in to your account</p>
        </div>
        <form class="auth-form" id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" class="form-input" id="email" placeholder="you@company.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Sign In</button>
        </form>
        <div class="auth-footer">
          Don't have an account? <a href="/register.html">Create one</a>
        </div>
      </div>
    </div>
  </div>

  <div class="spinner-overlay" id="loading-spinner"><div class="spinner"></div></div>

  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
