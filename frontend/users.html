<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage users, assign roles, and control access in ApprovalFlow.">
  <title>User Management — ApprovalFlow</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" onclick="App.closeSidebar()"></div>

    <div class="main-content">
      <header class="navbar">
        <div class="navbar-left">
          <button class="menu-toggle" onclick="App.toggleSidebar()">☰</button>
          <h2 class="page-title">Users</h2>
          <button class="btn btn-sm btn-primary" onclick="openCreateUserModal()" style="margin-left: 20px;">+ Create User</button>
        </div>
        <div class="navbar-right">
          <button class="navbar-btn" id="theme-toggle" onclick="App.toggleTheme()">🌙</button>
          <button class="navbar-btn" onclick="NotificationPanel.toggle()">🔔<span class="notification-badge hidden" id="notification-badge">0</span></button>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1>User Management</h1>
          <p>Manage users, assign roles, and control access</p>
        </div>

        <div class="filters-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Search users..." oninput="debouncedSearch()">
          </div>
          <select class="filter-select" id="role-filter" onchange="loadUsers()">
            <option value="">All Roles</option>
            <option value="Employee">Employee</option>
            <option value="Manager">Manager</option>
            <option value="Director">Director</option>
            <option value="Admin">Admin</option>
          </select>
          <select class="filter-select" id="dept-filter" onchange="loadUsers()">
            <option value="">All Departments</option>
            <option value="Engineering">Engineering</option>
            <option value="Finance">Finance</option>
            <option value="Sales">Sales</option>
            <option value="Marketing">Marketing</option>
            <option value="HR">HR</option>
            <option value="Legal">Legal</option>
            <option value="Operations">Operations</option>
          </select>
          <select class="filter-select" id="status-filter" onchange="loadUsers()">
            <option value="">All Status</option>
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>
          <select class="filter-select" id="sort-filter" onchange="loadUsers()">
            <option value="createdAt:desc">Newest First</option>
            <option value="createdAt:asc">Oldest First</option>
            <option value="name:asc">Name (A-Z)</option>
            <option value="name:desc">Name (Z-A)</option>
          </select>
        </div>

        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Role</th>
                <th>Department</th>
                <th>Status</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
        <div id="pagination-container"></div>
      </div>
    </div>
  </div>

  <!-- Role Change Modal -->
  <div class="modal-overlay" id="role-modal">
    <div class="modal">
      <div class="modal-header"><h3>Change User Role</h3><button class="modal-close" onclick="App.closeModal('role-modal')">✕</button></div>
      <div class="modal-body">
        <p id="role-modal-user" style="margin-bottom:16px;color:var(--text-secondary)"></p>
        <div class="form-group">
          <label class="form-label">New Role</label>
          <select class="form-select" id="new-role">
            <option value="Employee">Employee</option>
            <option value="Manager">Manager</option>
            <option value="Director">Director</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="App.closeModal('role-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="confirmRoleChange()">Update Role</button>
      </div>
    </div>
  </div>

  <!-- Create/Edit User Modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal">
      <div class="modal-header"><h3 id="user-modal-title">Create User</h3><button class="modal-close" onclick="App.closeModal('user-modal')">✕</button></div>
      <div class="modal-body">
        <form id="user-form">
          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" class="form-input" id="user-name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="user-email" required>
          </div>
          <div class="form-group" id="user-password-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="user-password">
          </div>
          <div class="form-group">
            <label class="form-label">Department</label>
            <select class="form-select" id="user-dept" required>
              <option value="Engineering">Engineering</option>
              <option value="Finance">Finance</option>
              <option value="Sales">Sales</option>
              <option value="Marketing">Marketing</option>
              <option value="HR">HR</option>
              <option value="Legal">Legal</option>
              <option value="Operations">Operations</option>
            </select>
          </div>
          <div class="form-group" id="user-role-group">
            <label class="form-label">Role</label>
            <select class="form-select" id="user-role">
              <option value="Employee">Employee</option>
              <option value="Manager">Manager</option>
              <option value="Director">Director</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="App.closeModal('user-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser()">Save</button>
      </div>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div class="modal-overlay" id="reset-modal">
    <div class="modal">
      <div class="modal-header"><h3>Reset Password</h3><button class="modal-close" onclick="App.closeModal('reset-modal')">✕</button></div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="form-input" id="reset-password" required>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="App.closeModal('reset-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="confirmResetPassword()">Reset</button>
      </div>
    </div>
  </div>

  <!-- Delete User Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <div class="modal-header"><h3>Delete User</h3><button class="modal-close" onclick="App.closeModal('delete-modal')">✕</button></div>
      <div class="modal-body">
        <p style="font-weight: 500; font-size: 16px; margin-bottom: 12px; color: var(--text-primary);">Are you sure you want to delete this user?</p>
        <div style="background: var(--bg-secondary); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 16px;">
          <div style="font-weight: 600; color: var(--text-primary);" id="delete-user-name"></div>
          <div style="font-size: 13px; color: var(--text-secondary);" id="delete-user-email"></div>
        </div>
        <p style="font-size: 13px; color: var(--danger-600); margin-top: 8px;">Warning: This action is permanent and cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="App.closeModal('delete-modal')">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDeleteUser()">Delete</button>
      </div>
    </div>
  </div>

  <div class="spinner-overlay" id="loading-spinner"><div class="spinner"></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js?v=2"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/users.js?v=2"></script>
</body>
</html>
