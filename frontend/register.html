<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your ApprovalFlow account to start managing document approvals.">
  <title>Register — ApprovalFlow</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">AF</div>
          <h2>Create Account</h2>
          <p>Join ApprovalFlow today</p>
        </div>
        <form class="auth-form" id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" class="form-input" id="name" placeholder="John Doe" required minlength="2">
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" class="form-input" id="email" placeholder="you@company.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="department">Department</label>
            <select class="form-select" id="department" required>
              <option value="">Select department</option>
              <option value="Engineering">Engineering</option>
              <option value="Finance">Finance</option>
              <option value="Sales">Sales</option>
              <option value="Marketing">Marketing</option>
              <option value="HR">HR</option>
              <option value="Legal">Legal</option>
              <option value="Operations">Operations</option>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-input" id="password" placeholder="Min 6 characters with a number" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" class="form-input" id="confirm-password" placeholder="Repeat your password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%" id="register-btn">Create Account</button>
        </form>
        <div class="auth-footer">
          Already have an account? <a href="/login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <div class="spinner-overlay" id="loading-spinner"><div class="spinner"></div></div>

  <script src="/js/app.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
