<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review and manage document approvals in ApprovalFlow.">
  <title>Approvals — ApprovalFlow</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" onclick="App.closeSidebar()"></div>

    <div class="main-content">
      <header class="navbar">
        <div class="navbar-left">
          <button class="menu-toggle" onclick="App.toggleSidebar()">☰</button>
          <h2 class="page-title">Approvals</h2>
        </div>
        <div class="navbar-right">
          <button class="navbar-btn" id="theme-toggle" onclick="App.toggleTheme()">🌙</button>
          <button class="navbar-btn" onclick="NotificationPanel.toggle()">🔔<span class="notification-badge hidden" id="notification-badge">0</span></button>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1 id="approvals-title">Document Approvals</h1>
          <p id="approvals-subtitle">Review and manage pending documents</p>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="approval-tabs">
          <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending')">⏳ Pending</button>
          <button class="tab-btn" data-tab="history" onclick="switchTab('history')">📋 History</button>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Search by title..." oninput="debouncedSearch()">
          </div>
          <select class="filter-select" id="status-filter" onchange="loadCurrentTab()">
            <option value="">All Statuses</option>
            <option value="Submitted">Submitted</option>
            <option value="ManagerApproved">Manager Approved</option>
            <option value="Completed">Completed</option>
            <option value="Rejected">Rejected</option>
            <option value="RevisionRequested">Revision Requested</option>
          </select>
          <select class="filter-select hidden" id="dept-filter" onchange="loadCurrentTab()">
            <option value="">All Departments</option>
            <option value="Engineering">Engineering</option>
            <option value="Finance">Finance</option>
            <option value="Sales">Sales</option>
            <option value="Marketing">Marketing</option>
            <option value="HR">HR</option>
            <option value="Legal">Legal</option>
            <option value="Operations">Operations</option>
          </select>
        </div>

        <!-- Documents List -->
        <div id="documents-list"></div>
        <div id="pagination-container"></div>
      </div>
    </div>
  </div>

  <!-- Action Modal -->
  <div class="modal-overlay" id="action-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="action-modal-title">Confirm Action</h3>
        <button class="modal-close" onclick="App.closeModal('action-modal')">✕</button>
      </div>
      <div class="modal-body">
        <p id="action-modal-desc" style="margin-bottom:16px;color:var(--text-secondary)"></p>
        <div class="form-group">
          <label class="form-label">Comment (optional)</label>
          <textarea class="form-textarea" id="action-comment" placeholder="Add a comment..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="App.closeModal('action-modal')">Cancel</button>
        <button class="btn" id="action-confirm-btn" onclick="confirmAction()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Document Detail Modal -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="detail-title">Document Details</h3>
        <button class="modal-close" onclick="App.closeModal('detail-modal')">✕</button>
      </div>
      <div class="modal-body" id="detail-body"></div>
    </div>
  </div>

  <div class="spinner-overlay" id="loading-spinner"><div class="spinner"></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/approvals.js"></script>
</body>
</html>
