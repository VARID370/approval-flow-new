<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ApprovalFlow Dashboard — View your document approval statistics and recent activity.">
  <title>Dashboard — ApprovalFlow</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" onclick="App.closeSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Navbar -->
      <header class="navbar">
        <div class="navbar-left">
          <button class="menu-toggle" onclick="App.toggleSidebar()">☰</button>
          <h2 class="page-title">Dashboard</h2>
        </div>
        <div class="navbar-right">
          <button class="navbar-btn" id="theme-toggle" onclick="App.toggleTheme()" title="Toggle theme">🌙</button>
          <button class="navbar-btn" onclick="NotificationPanel.toggle()" title="Notifications">
            🔔
            <span class="notification-badge hidden" id="notification-badge">0</span>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <div class="page-header">
          <h1 id="dashboard-greeting">Welcome back</h1>
          <p id="dashboard-subtitle">Here's what's happening today</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="stats-grid"></div>

        <!-- Content Grid -->
        <div class="grid-2" id="dashboard-content"></div>
      </div>
    </div>
  </div>

  <div class="spinner-overlay" id="loading-spinner"><div class="spinner"></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
