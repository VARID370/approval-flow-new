<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your ApprovalFlow profile, change password, and view activity history.">
  <title>Profile — ApprovalFlow</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" onclick="App.closeSidebar()"></div>

    <div class="main-content">
      <header class="navbar">
        <div class="navbar-left">
          <button class="menu-toggle" onclick="App.toggleSidebar()">☰</button>
          <h2 class="page-title">Profile</h2>
        </div>
        <div class="navbar-right">
          <button class="navbar-btn" id="theme-toggle" onclick="App.toggleTheme()">🌙</button>
          <button class="navbar-btn" onclick="NotificationPanel.toggle()">🔔<span class="notification-badge hidden" id="notification-badge">0</span></button>
        </div>
      </header>

      <div class="page-content">
        <!-- Profile Header -->
        <div class="profile-header" id="profile-header"></div>

        <div class="grid-2">
          <!-- Edit Profile -->
          <div class="card">
            <div class="card-header"><h3>Edit Profile</h3></div>
            <div class="card-body">
              <form id="profile-form">
                <div class="form-group">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-input" id="edit-name" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-input" id="edit-email" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Profile Picture</label>
                  <input type="file" class="form-input" id="avatar-file" accept="image/jpeg,image/png">
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </form>
            </div>
          </div>

          <!-- Change Password -->
          <div class="card">
            <div class="card-header"><h3>Change Password</h3></div>
            <div class="card-body">
              <form id="password-form">
                <div class="form-group">
                  <label class="form-label">Current Password</label>
                  <input type="password" class="form-input" id="current-password" required>
                </div>
                <div class="form-group">
                  <label class="form-label">New Password</label>
                  <input type="password" class="form-input" id="new-password" required minlength="6">
                </div>
                <div class="form-group">
                  <label class="form-label">Confirm New Password</label>
                  <input type="password" class="form-input" id="confirm-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Password</button>
              </form>
            </div>
          </div>
        </div>

        <!-- Activity History -->
        <div class="card mt-3">
          <div class="card-header"><h3>Recent Activity</h3></div>
          <div class="card-body" id="activity-list"></div>
          <div class="card-footer" id="activity-pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="spinner-overlay" id="loading-spinner"><div class="spinner"></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
